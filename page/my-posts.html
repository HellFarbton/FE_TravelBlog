<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Blogs - FAQ</title>
    <link rel="stylesheet" href="../assets/css/main.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="../favicon/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="../favicon/favicon.svg" />
    <link rel="shortcut icon" href="../favicon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="../favicon/site.webmanifest" />
    <!-- Font Manrope -->
    <link rel="stylesheet" href="../assets/font/Manrope/stylesheet.css" />
  </head>
  <body>
    <header id="header" class="header"></header>

    <main class="my-posts container">
      <div class="my-posts__header">
        <nav class="my-posts__nav">
          <ul class="my-posts__tabs">
            <li class="my-posts__tab my-posts__tab--active" data-status="all">
              All
            </li>
            <li class="my-posts__tab" data-status="in-review">In Review</li>
            <li class="my-posts__tab" data-status="publish">Publish</li>
            <li class="my-posts__tab" data-status="cancelled">Cancelled</li>
          </ul>
        </nav>

        <button class="my-posts__btn-create" id="btn-create-post">
          <i class="fas fa-plus"></i> Create Request Post
        </button>
      </div>

      <section class="my-posts__list" id="posts-list"></section>

      <nav class="my-posts__pagination" id="pagination"></nav>
    </main>

    <footer id="footer" class="footer"></footer>
    <script src="../assets/libs/jquery/dist/jquery.min.js"></script>
    <script src="../assets/js/scripts.js"></script>
    <script>
      load("#header", "../template/header.html");
      load("#footer", "../template/footer.html");
    </script>
    <script src="../assets/js/my-posts.js"></script>
  </body>
</html>
